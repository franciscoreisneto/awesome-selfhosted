const CONDITIONS = [
 { name:"Epilepsia", icon:"bolt", desc:"A epilepsia é uma das condições neurológicas mais comuns. Caracteriza-se por crises recorrentes causadas por descargas elétricas anormais no cérebro. Parte dos pacientes não responde adequadamente aos medicamentos disponíveis — são as chamadas epilepsias refratárias. A PSEG conduz estudos com novas terapias antiepilépticas que buscam oferecer alternativas para esses pacientes.", who:"Adultos com epilepsia de difícil controle que já tentaram pelo menos 2 medicamentos sem resultado satisfatório.", studies:"Fase II e III" },
 { name:"Alzheimer", icon:"puzzle", desc:"A doença de Alzheimer é a causa mais comum de demência, afetando a memória, o raciocínio e o comportamento. As pesquisas atuais focam em anticorpos monoclonais e tratamentos modificadores de doença que buscam retardar a progressão nos estágios iniciais — quando a intervenção pode fazer mais diferença.", who:"Pacientes com diagnóstico recente de Alzheimer leve a moderado, geralmente acima de 55 anos.", studies:"Fase II e III" },

const FAQS = [
 { q:"O que é pesquisa clínica?", a:"Pesquisa clínica é o processo pelo qual novos medicamentos, vacinas e tratamentos são testados em voluntários humanos antes de serem aprovados para uso geral. É um processo rigoroso, fiscalizado pela ANVISA e por comitês de ética independentes, que busca avaliar a segurança e a eficácia de um tratamento antes que ele possa ser aprovado para uso amplo." },
 { q:"Participar de um estudo é seguro?", a:"Todo estudo só chega ao participante após anos de pesquisa em laboratório e aprovação pela ANVISA e por comitês de ética independentes (CEP e, quando aplicável, CONEP). Durante todo o processo, você é acompanhado por médicos neurologistas especializados." },
 { q:"Existe algum custo para o participante?", a:"Nenhum. Todas as consultas, exames, medicamentos do estudo e, na maioria dos casos, transporte e alimentação nos dias de visita são cobertos. O participante não tem nenhum gasto." },
 { q:"Posso receber placebo em vez do tratamento?", a:"Em alguns estudos, parte dos participantes pode receber um placebo (substância sem efeito ativo) em vez do tratamento em investigação. Essa possibilidade é explicada em detalhes durante o processo de consentimento informado, antes de você decidir participar. Você tem o direito de saber exatamente como funciona o estudo." },
 { q:"Quem pode participar de uma pesquisa clínica?", a:"Cada estudo tem critérios específicos de participação, que podem incluir idade, tipo e estágio da condição, e tratamentos anteriores. O primeiro passo é entrar em contato com nossa equipe — faremos uma avaliação de elegibilidade, sem custo, para verificar se existe um estudo adequado para o seu perfil." },
 { q:"Posso sair do estudo quando quiser?", a:"Sim, a qualquer momento e sem precisar dar nenhuma justificativa. Esse é um direito garantido pela legislação brasileira. Sua decisão de sair não afetará seu tratamento médico regular." },
 { q:"Quem acompanha minha saúde durante o estudo?", a:"Uma equipe médica especializada liderada por neurologistas, incluindo enfermeiros, farmacêuticos e coordenadores de pesquisa. Na PSEG, o investigador principal é o Dr. Paulo Victor Sgobbi de Souza, neurologista com doutorado pela UNIFESP e atuação dedicada em doenças neuromusculares." },
 { q:"O que acontece se eu tiver algum efeito indesejado?", a:"A equipe médica está preparada para intervir a qualquer momento. Sua segurança é monitorada continuamente com exames regulares e consultas de acompanhamento. Em caso de qualquer intercorrência, o tratamento é ajustado ou interrompido." },
 { q:"Terei acesso ao tratamento após o término do estudo?", a:"A legislação brasileira (Lei 14.874/2024) prevê regras para fornecimento pós-estudo quando aplicável, conforme avaliação ética, protocolo e critérios legais. As condições específicas são detalhadas no termo de consentimento de cada estudo." },
 { q:"Qual a diferença entre pesquisa clínica e tratamento convencional?", a:"Na pesquisa clínica, o tratamento ainda está em fase de investigação — pode ser um medicamento novo ou uma nova forma de usar um medicamento existente. Uma característica importante é que o participante pode ter acesso a terapias que ainda não estão disponíveis no mercado, com acompanhamento médico especializado e sem custo, quando elegível conforme o protocolo." },
 { q:"Como faço para me inscrever em um estudo?", a:"Entre em contato pelo WhatsApp, telefone ou e-mail. Nossa equipe vai ouvir sua história, entender sua condição e verificar se existe um estudo adequado. A avaliação de elegibilidade é sem custo e sem compromisso." },
];

 chart:<svg {...s}><line x1="3" y1="21" x2="21" y2="21"/><rect x="5" y="14" width="3" height="7"/><rect x="10.5" y="9" width="3" height="12"/><rect x="16" y="5" width="3" height="16" stroke={accent}/></svg>,

 heartPulse:<svg {...s}><path d="M12 20s-7-4.2-7-10c0-2.5 2-4.5 4.5-4.5 1.5 0 2.5 1 2.5 1s1-1 2.5-1c2.5 0 4.5 2 4.5 4.5 0 5.8-7 10-7 10z"/><path d="M5 12h2l2-3 3 6 2-3h2" stroke={accent}/></svg>,
 building:<svg {...s}><rect x="4" y="2" width="16" height="20" rx="1.5"/><line x1="9" y1="6" x2="9" y2="6.01"/><line x1="15" y1="6" x2="15" y2="6.01"/><line x1="9" y1="10" x2="9" y2="10.01"/><line x1="15" y1="10" x2="15" y2="10.01"/><line x1="9" y1="14" x2="9" y2="14.01"/><line x1="15" y1="14" x2="15" y2="14.01"/><line x1="9" y1="18" x2="15" y2="18" stroke={accent}/></svg>,
 stethoscope:<svg {...s}><path d="M6 3v6a4 4 0 004 4 4 4 0 004-4V3"/><line x1="6" y1="3" x2="6" y2="3.01"/><line x1="14" y1="3" x2="14" y2="3.01"/><path d="M10 13v3a4 4 0 004 4 4 4 0 004-4v-1"/><circle cx="18" cy="14" r="1.5" stroke={accent}/></svg>,
 check:<svg {...s}><polyline points="20 6 9 17 4 12" stroke={accent}/></svg>,

 };
 return paths[name] || null;
}

 </div>

function Sec({ bg, children, id }) { return <section id={id} style={{ background:bg||C.w, padding:"80px 24px" }}><div style={{ maxWidth:1200, margin:"0 auto" }}>{children}</div></section>; }

function Head({ tag, title, sub, light }) {

function HoverCard({ children, style: s2, onClick, noSignature }) {
 const [h, setH] = useState(false);
 return (
  <div onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{ ...s2, transform:h?"translateY(-3px)":"none", boxShadow:h?"0 8px 24px rgba(10,37,64,0.08)":"0 1px 3px rgba(10,37,64,0.04)", transition:"all 0.25s ease", position:"relative", overflow:"hidden" }}>
   {!noSignature && (
    <div aria-hidden="true" style={{ position:"absolute", top:14, right:14, display:"flex", gap:4, pointerEvents:"none" }}>
     <span style={{ width:5, height:5, borderRadius:"50%", background:C.tl }}/>
     <span style={{ width:5, height:5, borderRadius:"50%", background:C.tl, opacity:0.55 }}/>
     <span style={{ width:5, height:5, borderRadius:"50%", background:C.tl, opacity:0.25 }}/>
    </div>
   )}
   {children}
  </div>
 );
}

function Btn({ children, href, outline, dark, small, onClick }) {
 const base = { padding:small?"10px 20px":"14px 28px", borderRadius:12, fontSize:small?12:14, fontWeight:600, textDecoration:"none", display:"inline-flex", alignItems:"center", gap:6, cursor:"pointer", border:"none", transition:"all 0.2s" };
 const st = outline ? { ...base, background:"transparent", color:dark?"#fff":C.navy, border:`1.5px solid ${dark?"rgba(255,255,255,0.2)":C.lt}` } : { ...base, background:C.td, color:"#fff" };
 if (href) return <a href={href} target="_blank" rel="noreferrer" style={st}>{children}</a>;
 return <button onClick={onClick} style={st}>{children}</button>;
}

  <p style={{ fontSize:15, color:C.m, lineHeight:1.85, marginBottom:14, textAlign:"center" }}>Quando você participa de um estudo clínico, tem acesso a tratamentos que ainda estão em fase de investigação. Em alguns casos, pode receber o tratamento experimental; em outros, pode receber placebo ou o tratamento padrão. Em todos os casos, recebe acompanhamento médico especializado, exames regulares e suporte contínuo, sem nenhum custo.</p>

function EstruturaPage() {
 const [lb, setLb] = useState(null);
 const [cols, setCols] = useState(4);

 React.useEffect(() => {
  const calcCols = () => {
   const w = window.innerWidth;
   if (w >= 1100) return 4;
   if (w >= 820)  return 3;
   if (w >= 560)  return 2;
   return 1;
  };
  const onResize = () => setCols(calcCols());
  setCols(calcCols());
  window.addEventListener("resize", onResize);
  return () => window.removeEventListener("resize", onResize);
 }, []);

 React.useEffect(() => {
  if (lb === null) return;
  const onKey = (e) => {
   if (e.key === "Escape") setLb(null);
   else if (e.key === "ArrowRight") setLb((i) => (i + 1) % GALERIA.length);
   else if (e.key === "ArrowLeft") setLb((i) => (i - 1 + GALERIA.length) % GALERIA.length);
  };
  window.addEventListener("keydown", onKey);
  const prev = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
 }, [lb]);

 const caps = [
  { t: "Recepção e atendimento dedicado", d: "Ambiente exclusivo para participantes de pesquisa, com equipe de coordenação dedicada do agendamento ao acompanhamento final." },

  { t: "Sala de coleta e tratamento", d: "Sala dedicada com poltronas reclináveis individuais, monitoramento e suporte para administração de produto investigacional e infusões prolongadas." },
  { t: "Farmácia clínica com manipulação asséptica", d: "Workstation de fluxo laminar de última geração para preparo de produto investigacional sob padrões ICH-GCP, com controle de dispensação e contabilidade." },
  { t: "Laboratório de processamento de amostras", d: "Centrífuga refrigerada e estruturas calibradas regularmente para processamento imediato de amostras biológicas no centro." },
  { t: "Armazenamento a temperatura ultrabaixa", d: "Ultrafreezer dedicado a −70 °C com monitoramento contínuo de temperatura, em conformidade com os protocolos mais rigorosos da indústria." },
 ];

 return (<>
 <Sec>
  <Head tag="Infraestrutura" title="Um centro projetado para pesquisa clínica de alta complexidade"/>
  <div style={{ maxWidth:780, margin:"0 auto" }}>
  <p style={{ fontSize:17, color:C.tx, lineHeight:1.85, margin:"0 0 18px", fontWeight:300 }}>
   A PSEG opera em uma estrutura concebida do zero para a condução de estudos clínicos — não uma adaptação de consultório ou ala hospitalar. Cada sala, cada equipamento e cada fluxo foi pensado para atender simultaneamente às exigências da indústria farmacêutica, das CROs e dos órgãos regulatórios.

function App() {
 const [pg, setPg] = useState("home");
 const [sc, setSc] = useState(false);
 const [menuOpen, setMenuOpen] = useState(false);
 const [isMobile, setIsMobile] = useState(typeof window !== "undefined" && window.innerWidth < 820);

 // Scroll listener com cleanup adequado (evita vazamento entre re-mounts)
 const scrollNodeRef = React.useRef(null);
 const ref = useCallback(n => {
  if (scrollNodeRef.current && scrollNodeRef.current._scrollHandler) {
   scrollNodeRef.current.removeEventListener("scroll", scrollNodeRef.current._scrollHandler);
  }
  if (!n) { scrollNodeRef.current = null; return; }
  const handler = () => setSc(n.scrollTop > 20);
  n._scrollHandler = handler;
  n.addEventListener("scroll", handler, { passive:true });
  scrollNodeRef.current = n;
 }, []);

 const go = p => {
  setPg(p);
  setMenuOpen(false);
  // Reset scroll state imediatamente para evitar nav "branca" piscando ao ir para Home
  setSc(false);
  const r = document.querySelector("[data-r]");
  if (r) r.scrollTo(0,0);
 };

 // Detecta tamanho de tela + fecha menu mobile ao redimensionar para desktop
 React.useEffect(() => {
  const check = () => {
   const m = window.innerWidth < 820;
   setIsMobile(m);
   if (!m) setMenuOpen(false); // evita menu "fantasma" preso ao crescer a janela
  };
  window.addEventListener("resize", check);
  return () => window.removeEventListener("resize", check);
 }, []);

 // Trava scroll do body quando menu mobile aberto (corrige bug do scroll passando atrás)
 React.useEffect(() => {
  if (!isMobile || !menuOpen) return;
  const prevBody = document.body.style.overflow;
  const prevHtml = document.documentElement.style.overflow;
  document.body.style.overflow = "hidden";
  document.documentElement.style.overflow = "hidden";
  const r = document.querySelector("[data-r]");
  const prevR = r ? r.style.overflow : null;
  if (r) r.style.overflow = "hidden";
  return () => {
   document.body.style.overflow = prevBody;
   document.documentElement.style.overflow = prevHtml;
   if (r) r.style.overflow = prevR || "";
  };
 }, [menuOpen, isMobile]);

 const nav = [{id:"home",l:"Home"},{id:"pacientes",l:"Pacientes"},{id:"sponsors",l:"Patrocinadores"},{id:"equipe",l:"Equipe"},{id:"estrutura",l:"Estrutura"},{id:"faq",l:"FAQ"}];

 const render = () => {
 switch(pg) {
  case "pacientes": return <PacientesPage go={go}/>;
  case "sponsors": return <SponsorsPage go={go}/>;
  case "equipe": return <EquipePage/>;
  case "estrutura": return <EstruturaPage/>;
  case "faq": return <FAQPage/>;
  default: return <HomePage go={go}/>;
 }
 };

 // Nav sempre opaca branca — antes ela ficava transparente sobre o body (branco)
 // com cores escuras, criando aparência de "duas linhas brancas desconectadas"
 // (uma do nav, outra acima do hero). Agora há borda sutil e blur consistente
 // em todas as páginas — sem flicker ao navegar entre abas.
 return (
 <div data-r ref={ref} style={{ height:"100vh", overflow:"auto", background:C.w, fontFamily:"'DM Sans',sans-serif" }}>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <nav style={{ position:"sticky", top:0, zIndex:200, background:"rgba(255,255,255,0.97)", backdropFilter:"blur(16px)", WebkitBackdropFilter:"blur(16px)", borderBottom:sc?`1px solid ${C.lt}`:"1px solid transparent", boxShadow:sc?"0 1px 12px rgba(10,37,64,0.04)":"none", transition:"border-color 0.2s ease, box-shadow 0.2s ease", padding:"0 24px" }}>
  <div style={{ maxWidth:1200, margin:"0 auto", display:"flex", justifyContent:"space-between", alignItems:"center", height:isMobile?56:68 }}>
   <div onClick={()=>go("home")} style={{ cursor:"pointer" }}><Logo s={isMobile?36:42}/></div>

   {/* DESKTOP NAV */}
   {!isMobile && (
   <div style={{ display:"flex", alignItems:"center", gap:2 }}>
    {nav.slice(1).map(n=>(
    <button key={n.id} onClick={()=>go(n.id)} style={{ padding:"6px 12px", border:"none", background:pg===n.id?C.tf:"transparent", color:pg===n.id?C.td:C.m, fontSize:12, fontWeight:pg===n.id?600:500, cursor:"pointer", borderRadius:8, whiteSpace:"nowrap", transition:"color 0.2s ease, background 0.2s ease" }}>{n.l}</button>
    ))}
    <div style={{ width:1, height:20, background:C.lt, margin:"0 8px" }}/>
    <Btn href={`https://api.whatsapp.com/send?phone=${PH}`} small>Contato</Btn>
   </div>
   )}

   {/* MOBILE HAMBURGER — escondido quando menu está aberto (X aparece dentro do menu) */}
   {isMobile && !menuOpen && (
   <button onClick={()=>setMenuOpen(true)} aria-label="Abrir menu" style={{ border:"none", background:"transparent", cursor:"pointer", padding:8 }}>
    <svg width="22" height="16" viewBox="0 0 22 16">

     <line x1="1" y1="14" x2="21" y2="14" stroke={C.navy} strokeWidth="2" strokeLinecap="round"/>
    </svg>
   </button>
   )}
  </div>
  </nav>

  {/* MOBILE MENU OVERLAY — full-screen.

  {isMobile && menuOpen && (

   {/* Header dentro do menu para alinhar com logo+X */}
   <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"0 24px", height:56, borderBottom:`1px solid ${C.lt}`, flexShrink:0 }}>

    <button onClick={()=>setMenuOpen(false)} aria-label="Fechar menu" style={{ border:"none", background:"transparent", cursor:"pointer", padding:8 }}>
    <svg width="22" height="16" viewBox="0 0 22 16">
     <line x1="2" y1="2" x2="20" y2="14" stroke={C.navy} strokeWidth="2" strokeLinecap="round"/>
     <line x1="2" y1="14" x2="20" y2="2" stroke={C.navy} strokeWidth="2" strokeLinecap="round"/>
    </svg>
    </button>
   </div>
   <div style={{ padding:"24px 24px 40px", flex:1 }}>
   <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
    {nav.map(n=>(
    <button key={n.id} onClick={()=>go(n.id)} style={{ padding:"14px 16px", border:"none", background:pg===n.id?C.tf:"transparent", color:pg===n.id?C.td:C.navy, fontSize:16, fontWeight:pg===n.id?600:400, cursor:"pointer", borderRadius:10, textAlign:"left", transition:"all 0.15s" }}>{n.l}</button>
    ))}
   </div>
   <div style={{ marginTop:20, paddingTop:20, borderTop:`1px solid ${C.lt}` }}>
    <Btn href={`https://api.whatsapp.com/send?phone=${PH}`}>Falar pelo WhatsApp</Btn>
   </div>
   </div>
   </div>
  )}

  {render()}

  <footer style={{ background:C.navy, padding:"48px 24px 20px" }}>
  <div style={{ maxWidth:1200, margin:"0 auto" }}>
   <div style={{ display:"flex", gap:40, flexWrap:"wrap", marginBottom:32 }}>
   <div style={{ flex:"1 1 240px" }}>
    <Logo s={40} light/>
    <div style={{ fontSize:11, color:"rgba(255,255,255,0.2)", marginTop:12, lineHeight:1.8 }}>Centro de Pesquisa Clínica S.A.<br/>CNPJ: 50.608.016/0001-50<br/>Rua Borges Lagoa, 1.060<br/>Vila Clementino · São Paulo – SP</div>
   </div>
   <div style={{ flex:"1 1 120px" }}>
    <div style={{ fontSize:11, fontWeight:600, color:"#fff", marginBottom:10 }}>Para Pacientes</div>
    {[["pacientes","O que é Pesquisa"],["equipe","Equipe"],["estrutura","Estrutura"],["faq","FAQ"]].map(([id,l],i)=><div key={i} onClick={()=>go(id)} style={{ fontSize:11, color:"rgba(255,255,255,0.25)", marginBottom:6, cursor:"pointer" }}>{l}</div>)}
   </div>
   <div style={{ flex:"1 1 120px" }}>
    <div style={{ fontSize:11, fontWeight:600, color:"#fff", marginBottom:10 }}>Institucional</div>
    {[["sponsors","Patrocinadores"],["equipe","Equipe"],["estrutura","Estrutura"]].map(([id,l],i)=><div key={i} onClick={()=>go(id)} style={{ fontSize:11, color:"rgba(255,255,255,0.25)", marginBottom:6, cursor:"pointer" }}>{l}</div>)}
   </div>
   <div style={{ flex:"1 1 120px" }}>
    <div style={{ fontSize:11, fontWeight:600, color:"#fff", marginBottom:10 }}>Contato</div>
    <div style={{ fontSize:11, color:"rgba(255,255,255,0.25)", lineHeight:2 }}>(11) 3791-9596<br/>(11) 91332-3742<br/>contato@psegtrials.com</div>
   </div>
   </div>
   {/* SEO-rich footer text — crawled by Google and AI bots */}
   <div style={{ borderTop:"1px solid rgba(255,255,255,0.05)", padding:"16px 0", marginBottom:12 }}>
   <p style={{ fontSize:10, color:"rgba(255,255,255,0.15)", lineHeight:1.8, maxWidth:800 }}>
    PSEG Centro de Pesquisa Clínica S.A. é um centro independente especializado em estudos clínicos em neurologia, localizado na Vila Clementino, São Paulo. Atuamos em pesquisas envolvendo epilepsia, Alzheimer, Parkinson, esclerose múltipla, enxaqueca crônica, neuropatias raras, AVC e doenças neuromusculares (ELA, AME, distrofias musculares). Investigador principal: Dr. Paulo Victor Sgobbi de Souza (CRM-SP 168.975), neurologista com doutorado pela UNIFESP em Neurologia e Neurociências, especialista em doenças neuromusculares. Avaliação de elegibilidade sem custo e sem compromisso.
   </p>
   </div>
   <div style={{ borderTop:"1px solid rgba(255,255,255,0.05)", paddingTop:16, display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:6 }}>
   <span style={{ fontSize:10, color:"rgba(255,255,255,0.15)" }}>© 2026 PSEG Centro de Pesquisa Clínica S.A.</span>

 </div>
 );
